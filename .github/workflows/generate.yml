name: 시장조사 보고서 자동 생성

on:
  push:
    paths:
      - "data/**.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: PPT 생성
        run: python build_all.py

      - name: 결과물 커밋 (output/ 폴더)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "자동 생성: 시장조사 보고서 PPT"
          file_pattern: "output/*.pptx"

      - name: 워크플로우 아티팩트로도 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 시장조사-보고서
          path: output/*.pptx
